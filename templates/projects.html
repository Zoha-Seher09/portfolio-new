{% extends "base.html" %}
{% block title %}Projects | My Portfolio{% endblock %}

{% block content %}
<section id="projects">
    <h1>My Projects</h1>
    <div class="card-container">
        {% for project in projects %}
            <div class="card">
                <h2>{{ project.title }}</h2>
                <p>{{ project.description }}</p>
                <a href="{{ project.link }}" target="_blank" class="btn">View Project</a>
            </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
