{% extends "base.html" %}
{% block title %}Contact | My Portfolio{% endblock %}

{% block content %}
<section id="contact">
    <h1>Contact Me</h1>
    
    {% if submitted %}
        <div class="card">
            <p style="color: var(--accent); font-weight: bold;">
                Thank you, {{ name }}! Your message has been sent successfully.
            </p>
        </div>
    {% else %}
        <form action="{{ url_for('contact') }}" method="POST" class="card">
            <div class="form-group">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 8px; margin-top: 5px;"></textarea>
            </div>
            <button type="submit" class="btn" style="margin-top: 15px;">Send Message</button>
        </form>
    {% endif %}
</section>
{% endblock %}
